bundle:
  name: ei-agentic-data-objects

# variables:
#   workspace_user:
#     description: Workspace user email for user-folder deployment

sync:
  include:
    - src/**/*.py

targets:
  dev:
    workspace:
      root_path: /Workspace/Shared/bundles/${bundle.name}/${bundle.target}

# ----------------------------------------------------------------------------
# NOTEBOOK-ONLY DEPLOYMENT (ACTIVE)
# ----------------------------------------------------------------------------
# This file currently deploys notebooks/files from src/** via the sync block.
# No resources section is required for notebook-only deployment.

# ----------------------------------------------------------------------------
# PIPELINE EXAMPLE (UNCOMMENT TO USE)
# ----------------------------------------------------------------------------
# resources:
#   pipelines:
#     simple_pipeline:
#       name: simple-pipeline
#       catalog: main
#       target: ei_dev
#       continuous: false
#       libraries:
#         - notebook:
#             path: ${workspace.file_path}/src/pipeline_notebook.py

# ----------------------------------------------------------------------------
# JOB ORCHESTRATION EXAMPLE (UNCOMMENT TO USE)
# ----------------------------------------------------------------------------
resources:
  jobs:
    sample_orchestration_job:
      name: sample-orchestration-job
      tasks:
        - task_key: run_first
          notebook_task:
            notebook_path: ${workspace.root_path}/src/first_notebook
            environment_key: default
        - task_key: run_second
          depends_on:
            - task_key: run_first
          notebook_task:
            notebook_path: ${workspace.root_path}/src/second_notebook
            environment_key: default
  environments:
    - environment_key: default
      spec:
        client: "1"